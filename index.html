<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viral Trend Scout</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface2: #242424;
      --border: #2e2e2e;
      --accent: #e53935;
      --hot: #ff6b35;
      --outlier: #ffd600;
      --green: #4caf50;
      --text: #e8e8e8;
      --muted: #888;
      --radius: 10px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      min-height: 100vh;
    }

    a { color: inherit; text-decoration: none; }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    header h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    header h1 span { color: var(--accent); }

    .api-status {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
      font-size: 12px;
      color: var(--muted);
    }
    .api-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }
    .api-dot.connected { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .api-dot.error { background: var(--accent); }

    /* ── Main layout ── */
    .container { max-width: 1200px; margin: 0 auto; padding: 24px; }

    /* ── Config panel ── */
    .config-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .config-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-end;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex: 1;
      min-width: 160px;
    }
    .field label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--muted);
    }

    /* Tag input */
    .tag-input-wrapper {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      min-height: 38px;
      cursor: text;
      transition: border-color 0.15s;
    }
    .tag-input-wrapper:focus-within { border-color: var(--accent); }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 6px 2px 8px;
      font-size: 12px;
      white-space: nowrap;
    }
    .tag-remove {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 0;
      display: flex;
      align-items: center;
    }
    .tag-remove:hover { color: var(--accent); }

    .tag-text-input {
      background: none;
      border: none;
      color: var(--text);
      font-size: 13px;
      outline: none;
      flex: 1;
      min-width: 120px;
    }
    .tag-text-input::placeholder { color: var(--muted); }

    input[type="text"], select {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      height: 38px;
      padding: 0 10px;
      width: 100%;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="text"]:focus, select:focus { border-color: var(--accent); }
    select option { background: var(--surface2); }

    .scan-btn {
      background: var(--accent);
      border: none;
      border-radius: 6px;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      height: 38px;
      padding: 0 28px;
      transition: opacity 0.15s, transform 0.1s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .scan-btn:hover:not(:disabled) { opacity: 0.88; }
    .scan-btn:active:not(:disabled) { transform: scale(0.97); }
    .scan-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ── Banners ── */
    .banner {
      border-radius: var(--radius);
      padding: 12px 16px;
      font-size: 13px;
      margin-top: 16px;
    }
    .banner.error { background: rgba(229,57,53,0.12); border: 1px solid rgba(229,57,53,0.3); color: #ef9a9a; }
    .banner.warn  { background: rgba(255,214,0,0.08); border: 1px solid rgba(255,214,0,0.25); color: #fff9c4; }

    /* ── Loading overlay ── */
    #loading-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 100;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
    }
    #loading-overlay.visible { display: flex; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: var(--muted); font-size: 13px; }

    /* ── Metrics row ── */
    #metrics {
      display: none;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 20px;
    }
    .metric-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
    }
    .metric-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); }
    .metric-value { font-size: 26px; font-weight: 700; margin-top: 4px; }
    .metric-value.accent { color: var(--accent); }
    .metric-value.hot { color: var(--hot); }
    .metric-value.yellow { color: var(--outlier); }

    /* ── Results section ── */
    #results { display: none; margin-top: 20px; }

    .results-toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .tabs {
      display: flex;
      gap: 4px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px;
    }
    .tab-btn {
      background: none;
      border: none;
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 12px;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { background: var(--surface2); color: var(--text); }

    .sort-wrapper {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
      color: var(--muted);
      font-size: 12px;
    }
    .sort-wrapper select { width: auto; height: 32px; font-size: 12px; }

    .results-count { font-size: 12px; color: var(--muted); }

    /* ── Video cards ── */
    #card-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 12px;
    }

    .video-card {
      display: block;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      transition: border-color 0.15s, background 0.15s;
      cursor: pointer;
    }
    .video-card:hover { border-color: #444; background: var(--surface2); }
    .video-card.is-outlier { border-color: rgba(255,214,0,0.3); }
    .video-card.is-hot { border-color: rgba(255,107,53,0.35); }
    .video-card.is-outlier.is-hot { border-color: rgba(255,107,53,0.5); }

    .card-badges {
      display: flex;
      gap: 5px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .badge {
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.4px;
      padding: 2px 6px;
      text-transform: uppercase;
    }
    .badge.hot     { background: rgba(255,107,53,0.18); color: var(--hot);     border: 1px solid rgba(255,107,53,0.3); }
    .badge.outlier { background: rgba(255,214,0,0.12);  color: var(--outlier); border: 1px solid rgba(255,214,0,0.25); }
    .badge.kw      { background: rgba(100,181,246,0.12); color: #90caf9;       border: 1px solid rgba(100,181,246,0.25); }
    .badge.ch      { background: rgba(129,199,132,0.12); color: #a5d6a7;       border: 1px solid rgba(129,199,132,0.25); }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-channel {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .card-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .stat {
      background: var(--surface2);
      border-radius: 6px;
      padding: 6px 8px;
    }
    .stat-label { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); }
    .stat-value { font-size: 13px; font-weight: 700; margin-top: 1px; }
    .stat-value.velocity-val { color: var(--hot); }
    .stat-value.outlier-val  { color: var(--outlier); }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 0;
      color: var(--muted);
    }
    .empty-state p { margin-top: 8px; font-size: 13px; }

    @media (max-width: 700px) {
      #metrics { grid-template-columns: repeat(2, 1fr); }
      .config-row { flex-direction: column; }
    }

    /* ── Hook Pattern Panel ── */
    #hook-panel {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      margin-top: 16px;
    }
    #hook-panel h2 {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .hook-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .hook-chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 12px;
      padding: 4px 12px;
    }
    .hook-chip-count { color: var(--hot); font-weight: 700; margin-right: 5px; }

    /* ── Video card (make position relative for save btn) ── */
    .video-card { position: relative; }

    /* ── Save / Watchlist button ── */
    .save-btn {
      position: absolute;
      top: 10px; right: 10px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
      line-height: 1;
      padding: 3px 8px;
      transition: border-color 0.15s, color 0.15s;
      z-index: 2;
    }
    .save-btn:hover { border-color: var(--outlier); color: var(--outlier); }
    .save-btn.saved { border-color: var(--outlier); color: var(--outlier); }

    /* ── Content Ideas per card ── */
    .ideas-toggle {
      margin-top: 10px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      font-size: 11px;
      padding: 5px 10px;
      width: 100%;
      text-align: left;
      transition: border-color 0.15s, color 0.15s;
    }
    .ideas-toggle:hover { border-color: #555; color: var(--text); }
    .ideas-panel {
      display: none;
      margin-top: 8px;
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }
    .ideas-panel.open { display: block; }
    .idea-item { margin-bottom: 10px; }
    .idea-item:last-child { margin-bottom: 0; }
    .idea-pillar {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 3px;
    }
    .idea-pillar.finance { color: #4caf50; }
    .idea-pillar.family  { color: #64b5f6; }
    .idea-pillar.build   { color: #ff9800; }
    .idea-text { font-size: 12px; line-height: 1.45; color: var(--text); }

    /* ── Watchlist view ── */
    #watchlist-view { display: none; margin-top: 4px; }
    .watchlist-empty { text-align: center; padding: 60px 0; color: var(--muted); }
    .watchlist-empty p { margin-top: 8px; font-size: 13px; }
    .watchlist-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .watchlist-title { font-size: 13px; font-weight: 600; color: var(--text); }
    .watchlist-title:hover { color: var(--accent); }
    .watchlist-meta { font-size: 12px; color: var(--muted); }
    .watchlist-notes {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 12px;
      padding: 8px 10px;
      width: 100%;
      resize: vertical;
      min-height: 52px;
      outline: none;
      transition: border-color 0.15s;
      font-family: inherit;
    }
    .watchlist-notes:focus { border-color: var(--accent); }
    .watchlist-remove {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 11px;
      align-self: flex-end;
      padding: 0;
    }
    .watchlist-remove:hover { color: var(--accent); }
    #watchlist-count-badge { color: var(--outlier); }
  </style>
</head>
<body>

<header>
  <h1>Viral Trend <span>Scout</span></h1>
  <div class="api-status">
    <div class="api-dot" id="api-dot"></div>
    <span id="api-label">Checking API…</span>
  </div>
</header>

<div class="container">

  <div class="config-panel">
    <div class="config-row">
      <div class="field" style="flex:2;min-width:220px">
        <label>Channel handles / IDs</label>
        <div class="tag-input-wrapper" id="tag-wrapper">
          <input class="tag-text-input" id="channel-input"
                 placeholder="@handle or UCxxxxxx — press Enter to add" />
        </div>
      </div>
      <div class="field" style="flex:1.2">
        <label>Keyword search</label>
        <input type="text" id="keyword-input" placeholder="e.g. AI news, vlog, review…" />
      </div>
    </div>
    <div class="config-row">
      <div class="field" style="min-width:130px;max-width:160px">
        <label>Time range</label>
        <select id="days-select">
          <option value="7">Last 7 days</option>
          <option value="14" selected>Last 14 days</option>
          <option value="30">Last 30 days</option>
          <option value="90">Last 90 days</option>
        </select>
      </div>
      <div class="field" style="min-width:150px;max-width:180px">
        <label>Outlier threshold</label>
        <select id="threshold-select">
          <option value="1.5">1.5× avg</option>
          <option value="2">2× avg</option>
          <option value="3" selected>3× avg (default)</option>
          <option value="5">5× avg</option>
          <option value="10">10× avg</option>
        </select>
      </div>
      <div style="margin-left:auto;display:flex;align-items:flex-end">
        <button class="scan-btn" id="scan-btn">⚡ Scan</button>
      </div>
    </div>
  </div>

  <div id="error-banner" class="banner error" style="display:none"></div>
  <div id="quota-banner" class="banner warn" style="display:none"></div>

  <div id="metrics">
    <div class="metric-card">
      <div class="metric-label">Videos Scanned</div>
      <div class="metric-value" id="m-scanned">—</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Outliers Found</div>
      <div class="metric-value yellow" id="m-outliers">—</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Peak Velocity</div>
      <div class="metric-value hot" id="m-velocity">—</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Total Views</div>
      <div class="metric-value accent" id="m-views">—</div>
    </div>
  </div>

  <div id="hook-panel">
    <h2>&#128269; Hook Patterns Found</h2>
    <div class="hook-list" id="hook-list"></div>
  </div>

  <div id="results">
    <div class="results-toolbar">
      <div class="tabs">
        <button class="tab-btn active" data-tab="all">All</button>
        <button class="tab-btn" data-tab="outliers">Outliers</button>
        <button class="tab-btn" data-tab="keyword">Keyword Hits</button>
        <button class="tab-btn" data-tab="channel">Channel Hits</button>
        <button class="tab-btn" data-tab="watchlist">&#9733; Watchlist <span id="watchlist-count-badge"></span></button>
      </div>
      <span class="results-count" id="results-count"></span>
      <div class="sort-wrapper">
        <span>Sort:</span>
        <select id="sort-select">
          <option value="velocity">Velocity</option>
          <option value="views">Total Views</option>
          <option value="outlier">Outlier Score</option>
          <option value="recent">Most Recent</option>
        </select>
      </div>
    </div>
    <div id="card-list"></div>
    <div id="watchlist-view"><div id="watchlist-items"></div></div>
  </div>

</div>

<div id="loading-overlay">
  <div class="spinner"></div>
  <div class="loading-text">Scanning YouTube…</div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
const state = {
  channels: [],
  results: [],
  activeTab: 'all',
  sortBy: 'velocity',
  loading: false,
};

// ── Hook Patterns ──────────────────────────────────────────────────────────
const HOOK_PATTERNS = [
  { id: 'i_did_x_for_time',  label: 'I [did X] for [time period]',           regex: /\bi\s+[\w\s]{2,30}for\s+\d+\s*(?:days?|weeks?|months?|years?|hours?)/i },
  { id: 'why_x_ruins_y',     label: 'Why [X] is ruining your [Y]',            regex: /\bwhy\s+.{3,40}\s+(?:is|are)\s+(?:ruining|killing|destroying|hurting)\s+your\b/i },
  { id: 'x_things_about',    label: '[N] things / reasons / tips / ways',     regex: /\b\d+\s+(?:things?|reasons?|ways?|tips?|mistakes?|steps?|secrets?|hacks?)\b/i },
  { id: 'truth_about',       label: 'The truth about [X]',                    regex: /\bthe\s+(?:real\s+)?truth\s+(?:about|behind)\b/i },
  { id: 'how_i_did',         label: 'How I [achieved result]',                regex: /\bhow\s+i\s+(?:made?|built?|paid?|saved?|earned?|lost?|grew?|went from|turned)\b/i },
  { id: 'what_nobody_tells', label: 'What nobody tells you about [X]',        regex: /\bwhat\s+(?:no\s*one|nobody)\s+(?:tells?|shows?|talks? about)\b/i },
  { id: 'stop_doing',        label: 'Stop [doing X]',                         regex: /\bstop\s+(?:doing|buying|wasting|spending|trying)\b/i },
  { id: 'i_tried',           label: 'I tried [X] — here\'s what happened',    regex: /\bi\s+(?:tried|tested|used|spent)\s+.{3,40}(?:so you|here.?s what|and here|and this)\b/i },
  { id: 'before_after',      label: 'Before vs After / transformation',       regex: /\b(?:before\s+(?:vs?\.?|and|&)\s+after|went from\s+.{3,30}\s+to)\b/i },
  { id: 'dollar_amount',     label: 'Specific dollar amount hook',            regex: /\$\d[\d,]*(?:\.\d+)?(?:k|m)?\b|\b\d[\d,]*\s*(?:dollars?|per\s+(?:month|week|year))\b/i },
  { id: 'day_challenge',     label: '[N]-day challenge / experiment',         regex: /\b\d+\s*-?\s*day\s+(?:challenge|experiment|journey|transformation)\b/i },
  { id: 'mistake',           label: 'Mistake / regret / wish I knew',         regex: /\b(?:biggest?\s+)?(?:mistake|regret|wish\s+i(?:'d|\s+had|\s+knew)|should(?:'ve|\s+have))\b/i },
];

const PILLAR_TEMPLATES = {
  i_did_x_for_time: {
    finance: '"I saved $500/month for 6 months straight — here\'s exactly what changed in our finances"',
    family:  '"I put my phone down every night for 30 days — what it did to my marriage and kids"',
    build:   '"I spent 90 days finishing my garage workshop — the full honest breakdown"',
  },
  why_x_ruins_y: {
    finance: '"Why your 9-5 is actually ruining your chance at financial freedom (and what to do instead)"',
    family:  '"Why always being \'busy\' is ruining your marriage — a husband\'s wake-up call"',
    build:   '"Why buying cheap tools is ruining your projects and costing you more in the long run"',
  },
  x_things_about: {
    finance: '"7 things I wish I knew about money before I got married" — your experience as the hook',
    family:  '"5 things nobody told me about being a husband and a dad at the same time"',
    build:   '"6 beginner building mistakes I made so you don\'t have to"',
  },
  truth_about: {
    finance: '"The real truth about building wealth on a normal income — no get-rich-quick stuff"',
    family:  '"The truth about being a \'present\' dad when you\'re also trying to build something"',
    build:   '"The truth about DIY home projects — time, cost, and what I\'d hire out next time"',
  },
  how_i_did: {
    finance: '"How I paid off $18K in debt while raising a family on one income"',
    family:  '"How I stopped being a distracted dad and actually started showing up for my kids"',
    build:   '"How I built a full workshop in my garage for under $800 — step by step"',
  },
  what_nobody_tells: {
    finance: '"What nobody tells you about buying a house — the real costs after closing"',
    family:  '"What nobody tells you about the first year of marriage — raw and honest"',
    build:   '"What nobody tells you before you start a big DIY project (I learned the hard way)"',
  },
  stop_doing: {
    finance: '"Stop doing these 4 things with your money if you actually want to build wealth"',
    family:  '"Stop sacrificing family time for productivity — it\'s not worth what you think"',
    build:   '"Stop buying this tool first — here\'s the order I\'d build a shop from scratch"',
  },
  i_tried: {
    finance: '"I tried zero-based budgeting for 60 days — here\'s what it actually did to our finances"',
    family:  '"I tried planning one intentional date night every week for a month — honest results"',
    build:   '"I tried the $50 tool vs the $200 tool for the same job — here\'s what happened"',
  },
  before_after: {
    finance: '"Our finances: before vs after we finally got on the same page as a couple"',
    family:  '"My marriage before vs after we had our first kid — what nobody prepares you for"',
    build:   '"My garage before vs after — 6-month transformation on a real budget (full build)"',
  },
  dollar_amount: {
    finance: '"We cut $600/month from our budget without changing our lifestyle — here\'s how"',
    family:  '"What it actually costs to raise a child in 2025 — real numbers from a real family"',
    build:   '"Full cost breakdown: how much it actually cost to finish my basement myself"',
  },
  day_challenge: {
    finance: '"30-day no-spend challenge as a family — what we learned and what we\'d do again"',
    family:  '"7-day screen-free evenings with my family — what broke first (hint: it was me)"',
    build:   '"I set a 30-day build challenge for myself — one project a week, full results"',
  },
  mistake: {
    finance: '"The biggest money mistake I made in my 20s — and how we\'re still recovering"',
    family:  '"The dad mistake I kept making without realizing it (and how I caught it)"',
    build:   '"The $1,200 building mistake I made on my first big project — don\'t do this"',
  },
};

const GENERIC_TEMPLATES = {
  finance: 'Mirror the format of this video but anchor it in a personal finance moment — a specific number, a turning point, or a family money decision you\'ve lived through',
  family:  'Take the emotional core of this video and retell it from your POV as a husband and dad — real story, real stakes, your marriage or your kids as the subject',
  build:   'Recreate this format around an actual project in your shop or home — a build, a tool review, a before/after, or a process you can document on camera',
};

function detectPattern(title) {
  for (const p of HOOK_PATTERNS) {
    if (p.regex.test(title)) return p.id;
  }
  return null;
}

function getContentIdeas(title) {
  const id = detectPattern(title);
  const t  = id ? PILLAR_TEMPLATES[id] : null;
  return {
    finance: t?.finance ?? GENERIC_TEMPLATES.finance,
    family:  t?.family  ?? GENERIC_TEMPLATES.family,
    build:   t?.build   ?? GENERIC_TEMPLATES.build,
  };
}

function extractHookPatterns(videos) {
  const counts = {};
  for (const p of HOOK_PATTERNS) counts[p.id] = 0;
  for (const v of videos) {
    for (const p of HOOK_PATTERNS) {
      if (p.regex.test(v.title)) counts[p.id]++;
    }
  }
  return HOOK_PATTERNS
    .map(p => ({ ...p, count: counts[p.id] }))
    .filter(p => p.count > 0)
    .sort((a, b) => b.count - a.count);
}

function renderHookPanel(videos) {
  const patterns = extractHookPatterns(videos);
  const panel    = document.getElementById('hook-panel');
  const list     = document.getElementById('hook-list');
  if (!patterns.length) { panel.style.display = 'none'; return; }
  list.innerHTML = patterns.map(p =>
    `<span class="hook-chip"><span class="hook-chip-count">${p.count}</span>${escHtml(p.label)}</span>`
  ).join('');
  panel.style.display = 'block';
}

// ── Watchlist ──────────────────────────────────────────────────────────────
function loadWatchlist() {
  try { return JSON.parse(localStorage.getItem('vts_watchlist') || '[]'); }
  catch { return []; }
}
function saveWatchlist(list) {
  localStorage.setItem('vts_watchlist', JSON.stringify(list));
}
function isWatchlisted(id) {
  return loadWatchlist().some(w => w.id === id);
}
function toggleWatchlist(video) {
  let list = loadWatchlist();
  if (list.some(w => w.id === video.id)) {
    list = list.filter(w => w.id !== video.id);
  } else {
    list.unshift({ id: video.id, title: video.title, channelName: video.channelName,
      velocity: video.velocity, viewCount: video.viewCount,
      savedAt: new Date().toISOString(), notes: '' });
  }
  saveWatchlist(list);
  updateWatchlistBadge();
}
function updateWatchlistBadge() {
  const count = loadWatchlist().length;
  const badge = document.getElementById('watchlist-count-badge');
  if (badge) badge.textContent = count ? `(${count})` : '';
}

let _noteDebounce = null;
function renderWatchlistView() {
  const list      = loadWatchlist();
  const container = document.getElementById('watchlist-items');
  if (!list.length) {
    container.innerHTML = `<div class="watchlist-empty"><strong>No saved ideas yet</strong>
      <p>Hit the ☆ button on any video card to save it here.</p></div>`;
    return;
  }
  container.innerHTML = list.map(w => `
    <div class="watchlist-item" data-wid="${escHtml(w.id)}">
      <a class="watchlist-title" href="https://www.youtube.com/watch?v=${escHtml(w.id)}"
         target="_blank" rel="noopener noreferrer">${escHtml(w.title)}</a>
      <div class="watchlist-meta">
        ${escHtml(w.channelName)} &middot; ${fmt(Math.round(w.velocity))}/hr &middot; ${fmt(w.viewCount)} views &middot; saved ${daysAgo(w.savedAt)}
      </div>
      <textarea class="watchlist-notes" data-wid="${escHtml(w.id)}"
                placeholder="How will you adapt this for your brand? (auto-saves)">${escHtml(w.notes)}</textarea>
      <button class="watchlist-remove" data-wid="${escHtml(w.id)}">Remove</button>
    </div>`).join('');
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('watchlist-items').addEventListener('input', e => {
    const ta = e.target.closest('.watchlist-notes');
    if (!ta) return;
    clearTimeout(_noteDebounce);
    _noteDebounce = setTimeout(() => {
      const list = loadWatchlist();
      const item = list.find(w => w.id === ta.dataset.wid);
      if (item) { item.notes = ta.value; saveWatchlist(list); }
    }, 600);
  });

  document.getElementById('watchlist-items').addEventListener('click', e => {
    const btn = e.target.closest('.watchlist-remove');
    if (!btn) return;
    const list = loadWatchlist().filter(w => w.id !== btn.dataset.wid);
    saveWatchlist(list);
    updateWatchlistBadge();
    renderWatchlistView();
    document.getElementById('results-count').textContent = list.length + ' saved';
  });
}, { once: true });

// ── Helpers ────────────────────────────────────────────────────────────────
function fmt(n) {
  if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'M';
  if (n >= 1_000)     return (n / 1_000).toFixed(1) + 'K';
  return String(n);
}

function daysAgo(isoStr) {
  const hours = (Date.now() - Date.parse(isoStr)) / 3_600_000;
  if (hours < 24) return Math.round(hours) + 'h ago';
  return Math.round(hours / 24) + 'd ago';
}

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

// ── API status ─────────────────────────────────────────────────────────────
async function checkApiStatus() {
  const dot   = document.getElementById('api-dot');
  const label = document.getElementById('api-label');
  try {
    const data = await fetch('/api/status').then(r => r.json());
    if (data.keyConfigured) {
      dot.className = 'api-dot connected';
      label.textContent = 'API key loaded';
    } else {
      dot.className = 'api-dot error';
      label.textContent = 'API key missing — check .env';
    }
  } catch {
    dot.className = 'api-dot error';
    label.textContent = 'Server offline';
  }
}

// ── Channel tags ───────────────────────────────────────────────────────────
function renderTags() {
  const wrapper = document.getElementById('tag-wrapper');
  const input   = document.getElementById('channel-input');
  wrapper.querySelectorAll('.tag').forEach(t => t.remove());
  for (const ch of state.channels) {
    const span = document.createElement('span');
    span.className = 'tag';
    span.innerHTML = escHtml(ch) +
      ` <button class="tag-remove" data-handle="${escHtml(ch)}" title="Remove">&times;</button>`;
    wrapper.insertBefore(span, input);
  }
}

function addChannelTag(raw) {
  const h = raw.trim().replace(/,$/, '');
  if (!h || state.channels.includes(h)) return;
  state.channels.push(h);
  renderTags();
}

function removeChannelTag(handle) {
  state.channels = state.channels.filter(c => c !== handle);
  renderTags();
}

// ── Filter / sort ──────────────────────────────────────────────────────────
const filters = {
  all:      ()  => true,
  outliers: v  => v.isOutlier,
  keyword:  v  => v.source === 'keyword' || v.source === 'both',
  channel:  v  => v.source === 'channel' || v.source === 'both',
};
const sorters = {
  velocity: (a, b) => b.velocity    - a.velocity,
  views:    (a, b) => b.viewCount   - a.viewCount,
  outlier:  (a, b) => b.outlierScore - a.outlierScore,
  recent:   (a, b) => Date.parse(b.publishedAt) - Date.parse(a.publishedAt),
};

function getFilteredSorted() {
  if (state.activeTab === 'watchlist') return [];
  return [...state.results]
    .filter(filters[state.activeTab] || filters.all)
    .sort(sorters[state.sortBy]);
}

// ── Cards ──────────────────────────────────────────────────────────────────
function renderCard(v) {
  const badges = [];
  if (v.isHot)     badges.push(`<span class="badge hot">&#128293; Hot</span>`);
  if (v.isOutlier) badges.push(`<span class="badge outlier">&#9889; ${v.outlierScore}&times; avg</span>`);
  if (v.source === 'keyword') badges.push(`<span class="badge kw">Keyword</span>`);
  if (v.source === 'channel') badges.push(`<span class="badge ch">Channel</span>`);
  if (v.source === 'both')    badges.push(`<span class="badge ch">Channel</span><span class="badge kw">Keyword</span>`);

  const cls        = ['video-card', v.isOutlier && 'is-outlier', v.isHot && 'is-hot'].filter(Boolean).join(' ');
  const thirdLabel = v.outlierScore > 0 ? 'vs Ch. Avg' : 'Published';
  const thirdVal   = v.outlierScore > 0 ? `${v.outlierScore}&times;` : escHtml(daysAgo(v.publishedAt));
  const saved      = isWatchlisted(v.id);
  const ideas      = getContentIdeas(v.title);

  return `
<div class="${cls}" data-id="${escHtml(v.id)}">
  <button class="save-btn${saved ? ' saved' : ''}" data-id="${escHtml(v.id)}" title="${saved ? 'Remove from Watchlist' : 'Save to Watchlist'}">${saved ? '★' : '☆'}</button>
  <div class="card-badges">${badges.join('')}</div>
  <a class="card-title" href="https://www.youtube.com/watch?v=${escHtml(v.id)}" target="_blank" rel="noopener noreferrer">${escHtml(v.title)}</a>
  <div class="card-channel">${escHtml(v.channelName)} &middot; ${escHtml(daysAgo(v.publishedAt))}</div>
  <div class="card-stats">
    <div class="stat">
      <div class="stat-label">Views</div>
      <div class="stat-value">${fmt(v.viewCount)}</div>
    </div>
    <div class="stat">
      <div class="stat-label">Velocity</div>
      <div class="stat-value velocity-val">${fmt(Math.round(v.velocity))}/hr</div>
    </div>
    <div class="stat">
      <div class="stat-label">${thirdLabel}</div>
      <div class="stat-value outlier-val">${thirdVal}</div>
    </div>
  </div>
  <button class="ideas-toggle" data-id="${escHtml(v.id)}">&#128161; Content ideas for your brand</button>
  <div class="ideas-panel" id="ideas-${escHtml(v.id)}">
    <div class="idea-item">
      <div class="idea-pillar finance">&#128176; Personal Finance</div>
      <div class="idea-text">${escHtml(ideas.finance)}</div>
    </div>
    <div class="idea-item">
      <div class="idea-pillar family">&#128106; Family / Dad Life</div>
      <div class="idea-text">${escHtml(ideas.family)}</div>
    </div>
    <div class="idea-item">
      <div class="idea-pillar build">&#128296; Building &amp; Creating</div>
      <div class="idea-text">${escHtml(ideas.build)}</div>
    </div>
  </div>
</div>`;
}

// ── Render ─────────────────────────────────────────────────────────────────
function render() {
  const list     = getFilteredSorted();
  const cardList = document.getElementById('card-list');
  const count    = document.getElementById('results-count');

  cardList.innerHTML = list.length
    ? list.map(renderCard).join('')
    : `<div class="empty-state">
         <strong>No videos found</strong>
         <p>${state.activeTab !== 'all' ? 'Try switching to the All tab.' : 'Adjust your search and try again.'}</p>
       </div>`;

  count.textContent = `${list.length} video${list.length !== 1 ? 's' : ''}`;
}

// ── Metrics ────────────────────────────────────────────────────────────────
function renderMetrics(meta) {
  document.getElementById('m-scanned').textContent  = meta.scanned.toLocaleString();
  document.getElementById('m-outliers').textContent = meta.outliers.toLocaleString();
  document.getElementById('m-velocity').textContent = fmt(meta.peakVelocity) + '/hr';
  document.getElementById('m-views').textContent    = fmt(meta.totalViews);
  document.getElementById('metrics').style.display  = 'grid';
}

function showError(msg) {
  const el = document.getElementById('error-banner');
  el.textContent = '✕ ' + msg;
  el.style.display = 'block';
}

// ── Scan ───────────────────────────────────────────────────────────────────
async function runScan() {
  const keyword   = document.getElementById('keyword-input').value.trim();
  const days      = parseInt(document.getElementById('days-select').value, 10);
  const threshold = parseFloat(document.getElementById('threshold-select').value);

  document.getElementById('error-banner').style.display = 'none';
  document.getElementById('quota-banner').style.display = 'none';

  if (!state.channels.length && !keyword) {
    showError('Add at least one channel handle or enter a keyword.');
    return;
  }

  document.getElementById('scan-btn').disabled = true;
  document.getElementById('loading-overlay').classList.add('visible');

  try {
    const res  = await fetch('/api/scan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ channels: state.channels, keyword, days, outlierThreshold: threshold }),
    });
    const data = await res.json();

    if (!res.ok) {
      showError(data.error || `Server error ${res.status}`);
      return;
    }

    state.results = data.videos;
    renderMetrics(data.meta);

    if (data.meta.quotaWarning) {
      const qb = document.getElementById('quota-banner');
      qb.textContent = '⚠️ ' + data.meta.quotaWarning;
      qb.style.display = 'block';
    }

    document.getElementById('results').style.display = 'block';
    render();
    renderHookPanel(state.results);

  } catch (err) {
    showError('Could not reach the server. Is it running on port 3000?');
  } finally {
    document.getElementById('scan-btn').disabled = false;
    document.getElementById('loading-overlay').classList.remove('visible');
  }
}

// ── Boot ───────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  checkApiStatus();
  updateWatchlistBadge();

  const channelInput = document.getElementById('channel-input');

  channelInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ',') {
      e.preventDefault();
      addChannelTag(channelInput.value);
      channelInput.value = '';
    } else if (e.key === 'Backspace' && channelInput.value === '' && state.channels.length) {
      removeChannelTag(state.channels[state.channels.length - 1]);
    }
  });

  document.getElementById('tag-wrapper').addEventListener('click', e => {
    const btn = e.target.closest('.tag-remove');
    if (btn) removeChannelTag(btn.dataset.handle);
    else channelInput.focus();
  });

  document.getElementById('scan-btn').addEventListener('click', runScan);

  document.getElementById('keyword-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') runScan();
  });

  // Card-level interactions (ideas toggle + save button)
  document.getElementById('card-list').addEventListener('click', e => {
    const toggle = e.target.closest('.ideas-toggle');
    if (toggle) {
      const panel = document.getElementById('ideas-' + toggle.dataset.id);
      if (!panel) return;
      const open = panel.classList.toggle('open');
      toggle.textContent = open ? '▲ Hide ideas' : '💡 Content ideas for your brand';
      return;
    }
    const saveBtn = e.target.closest('.save-btn');
    if (saveBtn) {
      e.preventDefault();
      const video = state.results.find(v => v.id === saveBtn.dataset.id);
      if (!video) return;
      toggleWatchlist(video);
      const nowSaved = isWatchlisted(video.id);
      saveBtn.classList.toggle('saved', nowSaved);
      saveBtn.textContent = nowSaved ? '★' : '☆';
      saveBtn.title = nowSaved ? 'Remove from Watchlist' : 'Save to Watchlist';
    }
  });

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.activeTab = btn.dataset.tab;

      const cardList     = document.getElementById('card-list');
      const watchlistView = document.getElementById('watchlist-view');
      const hookPanel    = document.getElementById('hook-panel');
      const countEl      = document.getElementById('results-count');

      if (state.activeTab === 'watchlist') {
        cardList.style.display      = 'none';
        watchlistView.style.display = 'block';
        hookPanel.style.display     = 'none';
        renderWatchlistView();
        const wl = loadWatchlist();
        countEl.textContent = wl.length + ' saved idea' + (wl.length !== 1 ? 's' : '');
      } else {
        cardList.style.display      = 'grid';
        watchlistView.style.display = 'none';
        if (state.results.length) hookPanel.style.display = 'block';
        render();
      }
    });
  });

  document.getElementById('sort-select').addEventListener('change', e => {
    state.sortBy = e.target.value;
    render();
  });
});
</script>
